<a class="skip-link" href="#main">Skip to content</a>

<header class="app-bar">
  <div class="app-bar__inner">
    <a class="brand" routerLink="/" (click)="closeNav()">
      <img
        class="brand__mark"
        src="brand/lumina-mark.svg"
        alt=""
        width="30"
        height="30"
      />
      <span class="brand__name">Lumina UI</span>
    </a>

    <nav class="app-nav" [class.is-open]="navOpen()" aria-label="Primary">
      @for (item of nav; track item.path) {
      <a
        class="app-nav__link"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        (click)="closeNav()"
      >
        {{ item.label }}
      </a>
      }
    </nav>

    <div class="app-bar__actions">
      <div class="accent-picker" role="group" aria-label="Accent colour">
        @for (a of accents; track a.value) {
        <button
          type="button"
          class="accent-picker__btn"
          [class.is-active]="accent() === a.value"
          [style.--_swatch]="a.swatch"
          [attr.aria-pressed]="accent() === a.value"
          [attr.aria-label]="a.label + ' accent'"
          [attr.title]="a.label"
          (click)="setAccent(a.value)"
        ></button>
        }
      </div>

      <div class="theme-toggle" role="group" aria-label="Theme">
        @for (mode of themeModes; track mode.value) {
        <button
          type="button"
          class="theme-toggle__btn"
          [class.is-active]="theme.mode() === mode.value"
          [attr.aria-pressed]="theme.mode() === mode.value"
          [attr.aria-label]="mode.label"
          (click)="setTheme(mode.value)"
        >
          {{ mode.icon }}
        </button>
        }
      </div>

      <a
        class="app-bar__github"
        href="https://github.com/rashika-svg/Lumina-UI"
        target="_blank"
        rel="noopener"
      >
        GitHub
      </a>

      <button
        type="button"
        class="app-bar__menu"
        [attr.aria-expanded]="navOpen()"
        aria-label="Toggle navigation"
        (click)="toggleNav()"
      >
        <span aria-hidden="true">{{ navOpen() ? '✕' : '☰' }}</span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <span>Lumina UI — an enterprise Angular design system platform.</span>
    <span class="app-footer__meta">Angular 21 · OKLCH design tokens · MIT</span>
  </div>
</footer>
