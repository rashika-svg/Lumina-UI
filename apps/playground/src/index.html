<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumina UI — Design system platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lumina UI — an enterprise Angular design-system platform with OKLCH tokens, runtime theming, live docs and a component laboratory."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Modern browsers prefer the SVG; the .ico stays as the fallback. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="brand/lumina-mark.svg" />
    <link rel="apple-touch-icon" href="brand/lumina-mark.svg" />

    <!--
      Resolve the theme synchronously, before first paint, so the boot screen and
      the app render in the correct palette (no flash of the wrong theme).
    -->
    <script>
      (function () {
        try {
          var k = 'lumina-theme';
          var m = localStorage.getItem(k) || 'system';
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = m === 'system' ? (d ? 'dark' : 'light') : m;
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <style>
      /* ── Boot loader ─────────────────────────────────────────────────────
         Self-contained (no token stylesheet dependency) so it can paint before
         the app bundle loads. All selectors are scoped under #lumina-boot so the
         generic utility class names cannot leak into the Angular app. */
      #lumina-boot {
        --_bg: oklch(0.9842 0.0034 247.86);
        --_fg: oklch(0.2077 0.0398 265.75);
        --_muted: oklch(0.4455 0.0374 257.28);

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: var(--_bg);
        color: var(--_fg);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      html[data-theme='dark'] #lumina-boot {
        --_bg: oklch(0.12 0.003 264);
        --_fg: oklch(0.9842 0.0034 247.86);
        --_muted: oklch(0.7107 0.0351 256.79);
      }
      #lumina-boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Animated gradient letter loader spelling LUMINA — stroke-drawing
         technique adapted from Uiverse.io by SelfMadeSystem. */
      #lumina-boot .loader {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #lumina-boot .absolute {
        position: absolute;
      }
      #lumina-boot .inline-block {
        display: inline-block;
      }
      /* Each glyph lives in the same 64×64 box, so the side bearings are pulled
         in with a negative margin to keep the word from reading as spaced-out. */
      #lumina-boot .letter {
        inline-size: 3rem;
        block-size: 3rem;
        margin-inline: -0.3rem;
      }
      /* The I is a bare stem, so it ships a cropped viewBox to avoid twice the
         side bearing of every other glyph — its box narrows to match. */
      #lumina-boot .letter--i {
        inline-size: 1.3125rem;
      }
      @media (max-width: 30rem) {
        #lumina-boot .letter {
          inline-size: 2.25rem;
          block-size: 2.25rem;
          margin-inline: -0.22rem;
        }
        #lumina-boot .letter--i {
          inline-size: 0.984rem;
        }
      }
      /* Negative delays stagger the letters into a travelling wave without
         leaving any of them blank on the first pass. */
      #lumina-boot .dash {
        animation:
          lumina-dashArray 2s ease-in-out infinite,
          lumina-dashOffset 2s linear infinite;
        animation-delay: calc(var(--i, 0) * -0.16s), calc(var(--i, 0) * -0.16s);
      }
      @keyframes lumina-dashArray {
        0% {
          stroke-dasharray: 0 1 359 0;
        }
        50% {
          stroke-dasharray: 0 359 1 0;
        }
        100% {
          stroke-dasharray: 359 1 0 0;
        }
      }
      @keyframes lumina-dashOffset {
        0% {
          stroke-dashoffset: 365;
        }
        100% {
          stroke-dashoffset: 5;
        }
      }

      #lumina-boot .lumina-boot__tagline {
        margin-block-start: -0.75rem;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
        color: var(--_muted);
      }
      #lumina-boot .lumina-boot__sr {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        #lumina-boot .dash {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Branded boot screen — removed by main.ts once Angular has bootstrapped. -->
    <div id="lumina-boot">
      <div class="loader" aria-hidden="true">
        <svg height="0" width="0" viewBox="0 0 64 64" class="absolute">
          <defs xmlns="http://www.w3.org/2000/svg">
            <!-- One gradient per letter, stepping around the spectrum so the
                 word reads as a single continuous sweep of colour. -->
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-1"
            >
              <stop stop-color="#973BED"></stop>
              <stop stop-color="#007CFF" offset="1"></stop>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-2"
            >
              <stop stop-color="#007CFF"></stop>
              <stop stop-color="#00E0ED" offset="1"></stop>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-3"
            >
              <stop stop-color="#00E0ED"></stop>
              <stop stop-color="#00DA72" offset="1"></stop>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-4"
            >
              <stop stop-color="#00DA72"></stop>
              <stop stop-color="#FFC800" offset="1"></stop>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-5"
            >
              <stop stop-color="#FFC800"></stop>
              <stop stop-color="#F0F" offset="1"></stop>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-6"
            >
              <stop stop-color="#F0F"></stop>
              <stop stop-color="#973BED" offset="1"></stop>
            </linearGradient>
          </defs>
        </svg>

        <!-- L -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="48"
          width="48"
          class="inline-block letter"
          style="--i: 0"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-1)"
            d="M 16,10 V 54 H 48"
            class="dash"
            pathLength="360"
          ></path>
        </svg>
        <!-- U -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="48"
          width="48"
          class="inline-block letter"
          style="--i: 1"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-2)"
            d="M 16,10 V 33 a 16,16 0 0 0 32,0 V 10"
            class="dash"
            pathLength="360"
          ></path>
        </svg>
        <!-- M -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="48"
          width="48"
          class="inline-block letter"
          style="--i: 2"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-3)"
            d="M 14,54 V 10 L 32,36 L 50,10 V 54"
            class="dash"
            pathLength="360"
          ></path>
        </svg>
        <!-- I -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="18 0 28 64"
          height="48"
          width="21"
          class="inline-block letter letter--i"
          style="--i: 3"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-4)"
            d="M 32,10 V 54"
            class="dash"
            pathLength="360"
          ></path>
        </svg>
        <!-- N -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="48"
          width="48"
          class="inline-block letter"
          style="--i: 4"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-5)"
            d="M 16,54 V 10 L 48,54 V 10"
            class="dash"
            pathLength="360"
          ></path>
        </svg>
        <!-- A -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="48"
          width="48"
          class="inline-block letter"
          style="--i: 5"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-6)"
            d="M 13,54 L 32,10 L 51,54 M 20.4,37 H 43.6"
            class="dash"
            pathLength="360"
          ></path>
        </svg>
      </div>

      <div class="lumina-boot__tagline">Design system platform</div>
      <span class="lumina-boot__sr" role="status">Loading Lumina UI…</span>
    </div>

    <lpg-root></lpg-root>
  </body>
</html>
