<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumina UI — Design system platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lumina UI — an enterprise Angular design-system platform with OKLCH tokens, runtime theming, live docs and a component laboratory."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Resolve the theme synchronously, before first paint, so the boot screen and
      the app render in the correct palette (no flash of the wrong theme).
    -->
    <script>
      (function () {
        try {
          var k = 'lumina-theme';
          var m = localStorage.getItem(k) || 'system';
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = m === 'system' ? (d ? 'dark' : 'light') : m;
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <style>
      /* ── Boot loader ─────────────────────────────────────────────────────
         Self-contained (no token stylesheet dependency) so it can paint before
         the app bundle loads. All selectors are scoped under #lumina-boot so the
         generic utility class names cannot leak into the Angular app. */
      #lumina-boot {
        --_bg: oklch(1 0 0);
        --_fg: oklch(0.2077 0.0398 265.75);
        --_muted: oklch(0.4455 0.0374 257.28);
        --_accent: oklch(0.5461 0.2152 262.88);

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: var(--_bg);
        color: var(--_fg);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      html[data-theme='dark'] #lumina-boot {
        --_bg: oklch(0.1288 0.0406 264.7);
        --_fg: oklch(0.9842 0.0034 247.86);
        --_muted: oklch(0.7107 0.0351 256.79);
        --_accent: oklch(0.6231 0.188 259.81);
      }
      #lumina-boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Uiverse.io by SelfMadeSystem — animated gradient letter loader. */
      #lumina-boot .loader {
        display: flex;
        align-items: center;
      }
      #lumina-boot .absolute {
        position: absolute;
      }
      #lumina-boot .inline-block {
        display: inline-block;
      }
      #lumina-boot .w-2 {
        width: 0.5em;
      }
      #lumina-boot .dash {
        animation:
          lumina-dashArray 2s ease-in-out infinite,
          lumina-dashOffset 2s linear infinite;
      }
      #lumina-boot .spin {
        animation:
          lumina-spinDashArray 2s ease-in-out infinite,
          lumina-spin 8s ease-in-out infinite,
          lumina-dashOffset 2s linear infinite;
        transform-origin: center;
      }
      @keyframes lumina-dashArray {
        0% {
          stroke-dasharray: 0 1 359 0;
        }
        50% {
          stroke-dasharray: 0 359 1 0;
        }
        100% {
          stroke-dasharray: 359 1 0 0;
        }
      }
      @keyframes lumina-spinDashArray {
        0% {
          stroke-dasharray: 270 90;
        }
        50% {
          stroke-dasharray: 0 360;
        }
        100% {
          stroke-dasharray: 270 90;
        }
      }
      @keyframes lumina-dashOffset {
        0% {
          stroke-dashoffset: 365;
        }
        100% {
          stroke-dashoffset: 5;
        }
      }
      @keyframes lumina-spin {
        0% {
          rotate: 0deg;
        }
        12.5%,
        25% {
          rotate: 270deg;
        }
        37.5%,
        50% {
          rotate: 540deg;
        }
        62.5%,
        75% {
          rotate: 810deg;
        }
        87.5%,
        100% {
          rotate: 1080deg;
        }
      }

      #lumina-boot .lumina-boot__wordmark {
        font-size: 1.15rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      #lumina-boot .lumina-boot__accent {
        margin-inline-start: 0.32em;
        color: var(--_accent);
      }
      #lumina-boot .lumina-boot__tagline {
        margin-block-start: -1.2rem;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
        color: var(--_muted);
      }
      #lumina-boot .lumina-boot__sr {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        #lumina-boot .dash,
        #lumina-boot .spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Branded boot screen — removed by main.ts once Angular has bootstrapped. -->
    <div id="lumina-boot">
      <div class="loader">
        <svg height="0" width="0" viewBox="0 0 64 64" class="absolute">
          <defs xmlns="http://www.w3.org/2000/svg">
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-1"
            >
              <stop stop-color="#973BED"></stop>
              <stop stop-color="#007CFF" offset="1"></stop>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="0"
              x2="0"
              y1="64"
              x1="0"
              id="lumina-grad-2"
            >
              <stop stop-color="#FFC800"></stop>
              <stop stop-color="#F0F" offset="1"></stop>
              <animateTransform
                repeatCount="indefinite"
                keySplines=".42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1"
                keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1"
                dur="8s"
                values="0 32 32;-270 32 32;-270 32 32;-540 32 32;-540 32 32;-810 32 32;-810 32 32;-1080 32 32;-1080 32 32"
                type="rotate"
                attributeName="gradientTransform"
              ></animateTransform>
            </linearGradient>
            <linearGradient
              gradientUnits="userSpaceOnUse"
              y2="2"
              x2="0"
              y1="62"
              x1="0"
              id="lumina-grad-3"
            >
              <stop stop-color="#00E0ED"></stop>
              <stop stop-color="#00DA72" offset="1"></stop>
            </linearGradient>
          </defs>
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="64"
          width="64"
          class="inline-block"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-1)"
            d="M 54.722656,3.9726563 A 2.0002,2.0002 0 0 0 54.941406,4 h 5.007813 C 58.955121,17.046124 49.099667,27.677057 36.121094,29.580078 a 2.0002,2.0002 0 0 0 -1.708985,1.978516 V 60 H 29.587891 V 31.558594 A 2.0002,2.0002 0 0 0 27.878906,29.580078 C 14.900333,27.677057 5.0448787,17.046124 4.0507812,4 H 9.28125 c 1.231666,11.63657 10.984383,20.554048 22.6875,20.734375 a 2.0002,2.0002 0 0 0 0.02344,0 c 11.806958,0.04283 21.70649,-9.003371 22.730469,-20.7617187 z"
            class="dash"
            id="y"
            pathLength="360"
          ></path>
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="64"
          width="64"
          class="inline-block"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="10"
            stroke="url(#lumina-grad-2)"
            d="M 32 32 m 0 -27 a 27 27 0 1 1 0 54 a 27 27 0 1 1 0 -54"
            class="spin"
            id="o"
            pathLength="360"
          ></path>
        </svg>
        <div class="w-2"></div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 64 64"
          height="64"
          width="64"
          class="inline-block"
        >
          <path
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="8"
            stroke="url(#lumina-grad-3)"
            d="M 4,4 h 4.6230469 v 25.919922 c -0.00276,11.916203 9.8364941,21.550422 21.7500001,21.296875 11.616666,-0.240651 21.014356,-9.63894 21.253906,-21.25586 a 2.0002,2.0002 0 0 0 0,-0.04102 V 4 H 56.25 v 25.919922 c 0,14.33873 -11.581192,25.919922 -25.919922,25.919922 a 2.0002,2.0002 0 0 0 -0.0293,0 C 15.812309,56.052941 3.998433,44.409961 4,29.919922 Z"
            class="dash"
            id="u"
            pathLength="360"
          ></path>
        </svg>
      </div>

      <div class="lumina-boot__wordmark">
        Lumina<span class="lumina-boot__accent">UI</span>
      </div>
      <div class="lumina-boot__tagline">Design system platform</div>
      <span class="lumina-boot__sr" role="status">Loading Lumina UI…</span>
    </div>

    <lpg-root></lpg-root>
  </body>
</html>
