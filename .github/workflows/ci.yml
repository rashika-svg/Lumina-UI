name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Derive the affected base/head SHAs for accurate `nx affected`.
      - uses: nrwl/nx-set-shas@v4

      - name: Formatting
        run: npx nx format:check

      - name: Lint, test, build, typecheck & Storybook (affected)
        run: npx nx affected -t lint test build typecheck build-storybook

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run affected E2E
        run: npx nx affected -t e2e
